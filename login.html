<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Lost&Found USTH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="asset/css/base.css">
    <link rel="stylesheet" href="asset/css/main.css">
    <link rel="stylesheet" href="asset/css/lostlink.css">
</head>
<body class="lostlink">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html" aria-label="Lost&Found USTH - Trang chủ">
                <img class="brand-logo" src="asset/images/brand/usth-lostfound-logo.png" alt="USTH Lost&Found">
                <span class="brand-text">
                    <span class="brand-title"><strong>USTH</strong> Lost&amp;Found</span>
                    <span class="brand-subtitle">Kết nối cộng đồng sinh viên</span>
                </span>
            </a>
            <nav class="main-nav" id="mainNavigation" aria-label="Điều hướng chính">
                <a href="index.html">Trang chủ</a>
                <a href="lost.html">Tin thất lạc</a>
                <a href="found.html">Tin nhặt được</a>
                <a href="contact.html">Liên hệ</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="index.html">Trang chủ</a><span>/</span><span>Đăng nhập</span></div>
                <span class="eyebrow">TÀI KHOẢN USTH</span>
                <h1>Đăng nhập</h1>
                <p>Đăng nhập để đăng tin, quản lý bài và gửi yêu cầu nhận đồ.</p>
            </div>
        </section>

        <section class="form-page">
            <div class="container form-shell" style="max-width:760px">
                <form class="form-card" id="userLoginForm">
                    <h2>Thông tin đăng nhập</h2>
                    <div class="field-grid">
                        <label class="field full">
                            <span>Email</span>
                            <input class="form-control" id="userEmail" type="email" required autocomplete="email">
                        </label>
                        <label class="field full">
                            <span>Mật khẩu</span>
                            <input class="form-control" id="userPassword" type="password" required autocomplete="current-password">
                        </label>
                    </div>
                    <p id="authMessage" style="display:none"></p>
                    <div class="form-actions">
                        <a class="btn btn-secondary" href="register.html">Chưa có tài khoản</a>
                        <button class="btn btn-primary" type="submit">Đăng nhập</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="asset/js/config.js"></script>
    <script src="asset/js/api.js"></script>
    <script src="asset/js/auth.js"></script>
    <script src="asset/js/lostlink-ui.js"></script>
</body>
</html>
